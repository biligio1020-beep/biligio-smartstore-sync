name: Sync BILIGIO SmartStore products

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Sync SmartStore to BILIGIO Cafe24
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BILIGIO_PROXY_KEY: ${{ secrets.BILIGIO_PROXY_KEY }}
          NAVER_STORE_SLUG: 'bili_gio'
          CAFE24_NAVER_PROXY_URL: 'https://biligio.mycafe24.com/newhome/api/naver-relay.php'
        run: npm run sync
